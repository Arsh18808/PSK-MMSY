{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
        <div class="card shadow-lg p-4 rounded-4">

            <h3 class="text-center text-primary mb-4">
                ✏ Edit MMSY Camp Report
            </h3>

            <form method="POST">

                <div class="row">

                    <!-- District -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">District</label>
                        <select name="district" class="form-control" required>
                            <option value="">Select District</option>
                            {% set districts = [
                            "Amritsar","Barnala","Bathinda","Faridkot",
                            "Fatehgarh Sahib","Fazilka","Firozpur (Ferozepur)",
                            "Gurdaspur","Hoshiarpur","Jalandhar",
                            "Kapurthala","Ludhiana","Malerkotla",
                            "Mansa","Moga","Pathankot","Patiala",
                            "Rupnagar (Ropar)","S.A.S. Nagar",
                            "Sangrur","Shaheed Bhagat Singh Nagar (Nawanshahr)",
                            "Sri Muktsar Sahib","Tarn Taran Sahib"
                            ] %}

                            {% for d in districts %}
                            <option value="{{ d }}"
                                {% if report[1] == d %} selected {% endif %}>
                                {{ d }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Location -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Camp Location</label>
                        <input type="text"
                               name="location"
                               value="{{ report[2] }}"
                               class="form-control"
                               required>
                    </div>

                    <!-- Operator Name -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Operator Name</label>
                        <input type="text"
                               name="operator_name"
                               value="{{ report[3] }}"
                               class="form-control"
                               required>
                    </div>

                    <!-- Mobile -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Operator Mobile</label>
                        <input type="text"
                               name="mobile"
                               value="{{ report[4] }}"
                               class="form-control"
                               pattern="[0-9]{10}"
                               maxlength="10"
                               title="Enter 10 digit mobile number"
                               required>
                    </div>

                    <!-- New MMSY -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">
                            New MMSY Transactions
                        </label>
                        <input type="number"
                               name="new_mmmsy"
                               value="{{ report[5] }}"
                               class="form-control"
                               min="0"
                               required>
                    </div>

                    <!-- Redo MMSY -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">
                            Redo MMSY Transactions
                        </label>
                        <input type="number"
                               name="redo_mmmsy"
                               value="{{ report[6] }}"
                               class="form-control"
                               min="0"
                               required>
                    </div>

                    <!-- Report Date (Read Only) -->
                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-semibold">
                            Reporting Date
                        </label>
                        <input type="text"
                               value="{{ report[7] }}"
                               class="form-control"
                               readonly>
                    </div>

                </div>

                <!-- Buttons -->
                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-success px-4">
                        Update Record
                    </button>

                    <a href="/view" class="btn btn-secondary px-4 ms-2">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>
</div>

{% endblock %}
