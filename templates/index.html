<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>MMSY Camp Reporting System</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>

    <body style="background: #f4f6f9">
        <div class="container mt-5">
            <div class="card shadow p-4">
                <h2 class="text-center text-primary mb-4">
                    MMSY Camp Reporting System
                </h2>

                <div class="alert alert-info text-center">
                    Transactions for current date only can be entered
                </div>

                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>District</label>
                            <select
                                name="district"
                                class="form-control"
                                required
                            >
                                <option value="">Select District</option>

                                <option>Amritsar</option>
                                <option>Barnala</option>
                                <option>Bathinda</option>
                                <option>Faridkot</option>
                                <option>Fatehgarh Sahib</option>
                                <option>Fazilka</option>
                                <option>Firozpur (Ferozepur)</option>
                                <option>Gurdaspur</option>
                                <option>Hoshiarpur</option>
                                <option>Jalandhar</option>
                                <option>Kapurthala</option>
                                <option>Ludhiana</option>
                                <option>Malerkotla</option>
                                <option>Mansa</option>
                                <option>Moga</option>
                                <option>Pathankot</option>
                                <option>Patiala</option>
                                <option>Rupnagar (Ropar)</option>
                                <option>S.A.S. Nagar</option>
                                <option>Sangrur</option>
                                <option>
                                    Shaheed Bhagat Singh Nagar (Nawanshahr)
                                </option>
                                <option>Sri Muktsar Sahib</option>
                                <option>Tarn Taran Sahib</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Camp Location</label>
                            <input
                                type="text"
                                name="location"
                                class="form-control"
                                required
                            />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Operator Name</label>
                            <input
                                type="text"
                                name="operator_name"
                                class="form-control"
                                required
                            />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Operator Mobile</label>
                            <input
                                type="text"
                                name="mobile"
                                class="form-control"
                                required
                            />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>New MMSY Transactions</label>
                            <input
                                type="number"
                                name="new_mmmsy"
                                class="form-control"
                                required
                            />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Redo MMSY Transactions</label>
                            <input
                                type="number"
                                name="redo_mmmsy"
                                class="form-control"
                                required
                            />
                        </div>

                        <div class="col-md-12 mb-3">
                            <label>Reporting Date</label>
                            <input
                                type="text"
                                value="{{ today }}"
                                class="form-control"
                                readonly
                            />
                        </div>
                    </div>

                    <div class="text-center">
                        <button class="btn btn-primary">Submit Report</button>

                        <a href="/view" class="btn btn-success">
                            View Reports
                        </a>

                        <a href="/export" class="btn btn-warning">
                            Export Excel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
